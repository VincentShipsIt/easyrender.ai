<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>easyrender.ai</title>
  <!-- The easyrender mark on a tile. Every coordinate is a multiple of 4 so it stays crisp at 16 and
       32 px. It follows the browser theme: ink on paper in light, bone on carbon in dark. -->
  <style>
    .tile { fill: #f3f2ee; }
    .mark { fill: #0a0a0b; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #0a0a0b; }
      .mark { fill: #ecebe7; }
    }
  </style>
  <rect class="tile" width="64" height="64" rx="14"/>
  <g class="mark">
    <path fill-rule="evenodd" d="M8 8H44V20H56V56H20V44H8ZM12 12V40H20V20H40V12ZM24 24V52H52V24Z"/>
    <circle cx="52" cy="12" r="4"/>
  </g>
</svg>
