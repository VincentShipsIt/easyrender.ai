<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <title>easyrender</title>
  <!-- The easyrender sphere, with a heavier outline than the page logo so it holds at 16 px.
       It follows the browser theme: lit side solid on dark, shadow side solid on light. -->
  <style>
    .on-dark { display: none; color: #ecebe7; }
    .on-light { color: #0a0a0b; }
    @media (prefers-color-scheme: dark) {
      .on-dark { display: inline; }
      .on-light { display: none; }
    }
  </style>
  <g class="on-light" transform="rotate(142 24 24)">
    <circle cx="24" cy="24" r="19.5" stroke="currentColor" stroke-width="3.5"/>
    <path d="M24 4.5A19.5 19.5 0 0 1 24 43.5A7.5 19.5 0 0 1 24 4.5Z" fill="currentColor"/>
  </g>
  <g class="on-dark" transform="rotate(-38 24 24)">
    <circle cx="24" cy="24" r="19.5" stroke="currentColor" stroke-width="3.5"/>
    <path d="M24 4.5A19.5 19.5 0 0 1 24 43.5A7.5 19.5 0 0 1 24 4.5Z" fill="currentColor"/>
  </g>
</svg>
