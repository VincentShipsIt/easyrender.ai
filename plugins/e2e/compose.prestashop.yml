# A real PrestaShop (PS_TAG picks the version), the module mounted in, and the mock easyrender API.
name: er-presta
services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: prestashop
      MARIADB_USER: ps
      MARIADB_PASSWORD: ps
      MARIADB_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 30

  api:
    image: node:22-alpine
    working_dir: /app
    command: node mock-api.mjs
    volumes:
      - ./:/app:ro
    ports:
      - "4010:4010"
    networks:
      default:
        aliases:
          - api.test

  prestashop:
    image: prestashop/prestashop:${PS_TAG:-8.1}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      DB_SERVER: db
      DB_NAME: prestashop
      DB_USER: ps
      DB_PASSWD: ps
      PS_DOMAIN: localhost:8080
      PS_INSTALL_AUTO: "1"
      PS_FOLDER_ADMIN: admin
      PS_FOLDER_INSTALL: install
      PS_ERASE_INSTALL_FOLDER: "1"
      PS_LANGUAGE: en
      PS_COUNTRY: GB
      PS_ENABLE_SSL: "0"
      ADMIN_MAIL: admin@example.com
      ADMIN_PASSWD: Password123!
    volumes:
      - psdata:/var/www/html
      - ../prestashop/easyrender3d:/mnt/easyrender3d:ro

volumes:
  psdata:
