# A real WordPress with WooCommerce, the WooCommerce plugin mounted in, and the mock easyrender API.
name: er-woo
services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
      MARIADB_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 30

  api:
    image: node:22-alpine
    working_dir: /app
    command: node mock-api.mjs
    volumes:
      - ./:/app:ro
    ports:
      - "4010:4010"
    networks:
      default:
        aliases:
          - api.test

  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wp
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_HOME', 'http://localhost:8080' );
        define( 'WP_SITEURL', 'http://localhost:8080' );
        define( 'EASYRENDER_API_URL', 'http://api.test:4010' );
        define( 'WP_DEBUG', true );
        define( 'WP_DEBUG_LOG', '/var/www/html/wp-content/debug.log' );
        define( 'WP_DEBUG_DISPLAY', false );
    volumes:
      - wpdata:/var/www/html
      - ../woocommerce/easyrender-3d:/var/www/html/wp-content/plugins/easyrender-3d:ro
      - ./mu/easyrender-e2e.php:/var/www/html/wp-content/mu-plugins/easyrender-e2e.php:ro

  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    user: "33:33"
    depends_on:
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wp
    volumes:
      - wpdata:/var/www/html
      - ../woocommerce/easyrender-3d:/var/www/html/wp-content/plugins/easyrender-3d:ro
      - ./fixtures:/fixtures:ro

volumes:
  wpdata:
