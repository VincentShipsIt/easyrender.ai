# Shopify app configuration. Deploy with the Shopify CLI from this folder: `shopify app deploy`.
# Replace client_id with the one from the Partner dashboard (see README.md).
client_id = "REPLACE_WITH_CLIENT_ID"
name = "easyrender 3D & AR"
# The embedded page is served by apps/web at easyrender.ai/shopify, not by a separate server.
application_url = "https://easyrender.ai/shopify"
embedded = true

[access_scopes]
# read_products lists the catalogue; write_products puts each model's id on its product (a metafield).
scopes = "read_products,write_products"
use_legacy_install_flow = false

[auth]
redirect_urls = ["https://easyrender.ai/shopify"]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "https://easyrender.ai/api/shopify/webhooks"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "https://easyrender.ai/api/shopify/webhooks"
