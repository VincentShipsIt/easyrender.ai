name: Parts spike
run-name: "Parts spike · ${{ inputs.candidates }} · ${{ inputs.photos }}"

# Manual only. Runs candidate image-to-3D models on Replicate (PBR output, part-aware output) on
# showcase photos, and records what each GLB contains: meshes, materials, texture maps, part names,
# time and cost. It spends real money, capped by the `cap` input in USD, so it needs the word
# "spend" typed in. Needs the repository secret REPLICATE_API_TOKEN. The GLBs are uploaded as an
# artifact so a person can open them; the log ends with the summary table.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "spend" to confirm this spends Replicate credit'
        required: true
        type: string
      cap:
        description: "Hard cap on estimated spend, in USD"
        required: true
        default: "5"
        type: string
      candidates:
        description: "Comma-separated ids: baseline, hunyuan21, partcrafter, trellis2"
        required: true
        default: "baseline,hunyuan21,partcrafter,trellis2"
        type: string
      photos:
        description: "Comma-separated showcase photos (armchair, bedside-table, clay-vase, coffee-table, swivel-chair, vase)"
        required: true
        default: "armchair,coffee-table"
        type: string

permissions:
  contents: read

jobs:
  spike:
    name: Parts spike
    if: ${{ inputs.confirm == 'spend' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Run the spike
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          CAP: ${{ inputs.cap }}
          CANDIDATES: ${{ inputs.candidates }}
          PHOTOS: ${{ inputs.photos }}
        run: bun packages/harness/scripts/parts-spike.ts --spend --cap="$CAP" --candidates="$CANDIDATES" --photos="$PHOTOS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parts-spike
          path: parts-spike-out
          if-no-files-found: ignore
